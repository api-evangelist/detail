aid: detail
name: Detail
description: Detail is a video creation and editing app for iOS and macOS built by Detail
  Technologies B.V., a Point Nine portfolio company. It combines multi-camera recording,
  AI-powered auto-editing (silence removal, zoom cuts, captions, titles, and music), live
  multi-platform streaming to YouTube, Twitch, Instagram, and LinkedIn, a built-in teleprompter,
  green-screen background removal, and automatic captions, aimed at creators, podcasters, and
  streamers producing polished video quickly. Detail won the 2025 App Store Award for iPad App
  of the Year and was a 2026 Apple Design Award finalist. It is a consumer application and does
  not currently publish a public developer API.
